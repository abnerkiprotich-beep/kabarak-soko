<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabarak Soko - Cart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #f68b1e;
            color: white;
            min-height: 64px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            gap: 25px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 800;
            white-space: nowrap;
        }

        .search-box {
            flex: 1;
            max-width: 650px;
            display: flex;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            padding: 13px 16px;
            font-size: 15px;
            border-radius: 4px 0 0 4px;
        }

        .search-box button {
            border: none;
            background: #333;
            color: white;
            padding: 0 22px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .header-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .cart-count {
            background: white;
            color: #f68b1e;
            padding: 3px 7px;
            border-radius: 50%;
            font-size: 12px;
            margin-left: 4px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 5px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .page-title h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .page-title p {
            color: #777;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            align-items: start;
        }

        .cart-items {
            background: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 18px;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .product-image {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 4px;
        }

        .product-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-category {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .product-price {
            color: #f68b1e;
            font-weight: 700;
            font-size: 18px;
        }

        .stock-text {
            color: #555;
            font-size: 13px;
            margin-top: 8px;
        }

        .quantity-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .quantity-button {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 18px;
            border-radius: 3px;
        }

        .quantity-button:hover {
            background: #f5f5f5;
        }

        .quantity {
            min-width: 35px;
            text-align: center;
            font-weight: 600;
        }

        .remove-button {
            border: none;
            background: none;
            color: #e53935;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        .remove-button:hover {
            text-decoration: underline;
        }

        .item-total {
            font-size: 18px;
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }

        .summary {
            background: white;
            border-radius: 5px;
            padding: 22px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 84px;
        }

        .summary h2 {
            font-size: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #ddd;
            padding-top: 18px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .checkout-button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            background: #f68b1e;
            color: white;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .checkout-button:hover {
            background: #df7710;
        }

        .continue-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #f68b1e;
            text-decoration: none;
            font-weight: 600;
        }

        .empty-cart {
            background: white;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-cart-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            background: #f68b1e;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 4px;
            font-weight: 700;
        }

        .notification {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #333;
            color: white;
            padding: 14px 20px;
            border-radius: 4px;
            display: none;
            z-index: 2000;
        }

        @media (max-width: 850px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

            .header {
                flex-wrap: wrap;
                padding: 12px 4%;
            }

            .search-box {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 96%;
                margin: 15px auto;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
                padding: 15px;
            }

            .product-image {
                width: 80px;
                height: 80px;
            }

            .item-total {
                grid-column: 2;
                text-align: left;
            }

            .logo {
                font-size: 20px;
            }

            .header-link {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="/" class="logo">KABARAK SOKO</a>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >
        <button type="button" id="searchButton">Search</button>
    </div>

    <a href="/" class="header-link">Home</a>

    <a href="/cart.html" class="header-link">
        Cart
        <span class="cart-count" id="cartCount">0</span>
    </a>
</header>

<main class="container">

    <section class="page-title">
        <h1>Shopping Cart</h1>
        <p id="cartDescription">Your selected products</p>
    </section>

    <div id="cartContainer"></div>

</main>

<div class="notification" id="notification"></div>

<script src="/cart.js"></script>

</body>
</html>
