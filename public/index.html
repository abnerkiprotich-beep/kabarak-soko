<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KABARAK SOKO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Roboto,Arial,sans-serif;background:#f5f5f5;padding-bottom:80px}
.top-search{padding:12px 16px;background:white;position:sticky;top:0;z-index:100}
.search-bar{width:100%;background:#f1f1f1;border-radius:30px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#555}
.banner-wrap{padding:10px 0 0 10px}
.banner-slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.banner-slider::-webkit-scrollbar{display:none}
.banner{min-width:92%;height:185px;border-radius:18px;scroll-snap-align:center;overflow:hidden;position:relative;background:#a91e2e;display:flex;align-items:center}
.banner img{width:100%;height:100%;object-fit:cover}
.dots{display:flex;justify-content:center;gap:7px;margin:12px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc}
.dot.active{width:28px;border-radius:10px;background:#333}
.cat-home-section{background:#fdf0d5;margin:14px 12px;border-radius:18px;padding:14px 8px}
.cat-home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.cat-home-item{text-align:center}
.cat-img-wrap{width:72px;height:72px;margin:0 auto;background:white;border-radius:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.cat-img-wrap::before{content:'';position:absolute;width:100%;height:100%;background:#ffb700;clip-path:polygon(52% 0,100% 0,100% 100%,0 80%);z-index:0}
.cat-img-wrap img{width:52px;height:52px;object-fit:contain;z-index:1;background:white;border-radius:50%;padding:4px}
.cat-home-item p{font-size:13px;font-weight:700;color:#8a5d00;margin-top:6px;line-height:1.2}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:18px 14px 10px}
.section-header h2{font-size:20px;font-weight:800}
.arrow-btn{width:56px;height:32px;background:#222;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:18px}
.product-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}
.product-scroll::-webkit-scrollbar{display:none}
.p-card{min-width:168px;max-width:168px;background:white;border-radius:14px;overflow:hidden;border:1px solid #eee}
.p-img{width:100%;height:150px;background:white;display:flex;align-items:center;justify-content:center}
.p-img img{width:100%;height:100%;object-fit:contain;padding:8px}
.p-info{padding:8px}
.p-name{font-size:12px;height:30px;overflow:hidden;line-height:1.3}
.p-price{font-weight:900;font-size:14px;margin-top:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;z-index:1000}
.nav-item{text-align:center;font-size:11px;color:#666;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}
.nav-item.active{color:#f68b1e}
.nav-icon{font-size:22px}
</style>
</head>
<body>

<div class="top-search">
  <div class="search-bar">🔍 Search on Kabarak Soko</div>
</div>

<div class="banner-wrap" id="bannerContainer">
  <div class="banner-slider" id="bannerSlider">
    <div class="banner"><img src="https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=800" onerror="this.src='https://via.placeholder.com/800x400/a91e2e/ffffff?text=Galaxy+A06+4%2B64GB+KSh+12,399'"></div>
    <div class="banner"><img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=800" onerror="this.src='https://via.placeholder.com/800x400/222/fff?text=Top+Deals+70%25+OFF'"></div>
  </div>
  <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="cat-home-section" id="catSection">
  <div class="cat-home-grid" id="topCatGrid"></div>
</div>

<div class="section-header"><h2 id="sectionTitle">Top selling items</h2><div class="arrow-btn">→</div></div>
<div class="product-scroll" id="productGrid"></div>

<div class="bottom-nav">
  <a href="#" class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span>Home</a>
  <a href="#" class="nav-item" data-tab="categories"><span class="nav-icon">☰</span>Categories</a>
  <a href="#" class="nav-item" data-tab="cart"><span class="nav-icon">🛒</span>Cart <span id="cartCount" style="background:#f68b1e;color:white;border-radius:10px;padding:1px 6px;font-size:10px">0</span></a>
  <a href="#" class="nav-item" data-tab="wishlist"><span class="nav-icon">♡</span>Wishlist</a>
  <a href="#" class="nav-item" data-tab="account"><span class="nav-icon">👤</span>Account</a>
</div>

<script>
const HOME_CATS = [
 {name:"Phone Deals", img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=200"},
 {name:"Solar & Lighting", img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=200"},
 {name:"Smartwatches", img:"https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=200"},
 {name:"Shoe Deals", img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200"},
 {name:"Laptops", img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=200"},
 {name:"TV Stands", img:"https://images.unsplash.com/photo-1538688525198-9b88f6f53126?w=200"},
 {name:"TVs", img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=200"},
 {name:"Music Systems", img:"https://images.unsplash.com/photo-1545454675-3531b543be5d?w=200"}
];

const CATEGORY_DATA = {
  "Phone & Tablets": {"Mobile Phones": ["Smartphones","iPhones","Samsung","Tecno & Infinix"], "Accessories": ["Cases","Chargers","Power Banks","Smart Watches"]},
  "Tvs & Audio": {"Televisions": ["Smart TVs","32\" TVs","43\" TVs"], "Audio": ["Speakers","Headphones"]},
  "Appliances": {"Large": ["Fridges","Cookers","Washers"], "Small": ["Blenders","Kettles","Irons"]},
  "Health & Beauty": {"Beauty": ["Makeup","Skincare"], "Health": ["Supplements"]},
  "Home & Office": {"Furniture": ["Sofas","Beds","TV Stands"], "Decor": ["Beddings","Curtains"]},
  "Fashion": {"Men": ["T-Shirts","Jeans","Shoes"], "Women": ["Dresses","Bags","Heels"]},
  "Computing": {"Laptops": ["HP","Dell","Lenovo","MacBook"], "Accessories": ["Mouse","Printers"]},
  "Gaming": {"Consoles": ["PS5","Xbox","Controllers"], "Games": ["Video Games","Headsets"]},
  "Sporting Goods": {"Wear": ["Jerseys","Trainers"], "Equipment": ["Balls","Bicycles"]},
  "Supermarket": {"Food": ["Rice","Flour","Milk"], "Drinks": ["Soda","Water"]},
  "Garden & Outdoors": {"Garden": ["Tools","Seeds"], "Outdoor": ["Tents","Chairs"]}
};

const productGrid=document.getElementById('productGrid');
const topCatGrid=document.getElementById('topCatGrid');
const catSection=document.getElementById('catSection');
const bannerContainer=document.getElementById('bannerContainer');
const sectionTitle=document.getElementById('sectionTitle');

function renderHome(){
 catSection.style.display='block';
 bannerContainer.style.display='block';
 sectionTitle.textContent='Top selling items';
 topCatGrid.innerHTML = HOME_CATS.map(c=>`
  <div class="cat-home-item">
    <div class="cat-img-wrap"><img src="${c.img}"></div>
    <p>${c.name}</p>
  </div>
 `).join('');
 productGrid.innerHTML = [
  {name:"Ailyons Fast Boil Kettle 2.0L", price:1899, img:"https://images.unsplash.com/photo-1544787219-7f47cc556762?w=400"},
  {name:"Ailyons Electric Kettle Silver", price:1899, img:"https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=400"},
  {name:"Tecno Spark 20", price:15499, img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
  {name:"Hisense 32\" TV", price:14999, img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=400"}
 ].map(p=>`<div class="p-card"><div class="p-img"><img src="${p.img}"></div><div class="p-info"><div class="p-name">${p.name}</div><div class="p-price">KSh ${p.price.toLocaleString()}</div></div></div>`).join('');
}

function showCategoriesView(){
 catSection.style.display='none';
 bannerContainer.style.display='none';
 sectionTitle.textContent='All Categories';
 const mainCats=Object.keys(CATEGORY_DATA);
 productGrid.innerHTML=`
  <div style="display:flex;width:100%;min-height:70vh;background:white;border-radius:12px;overflow:hidden">
    <div style="width:35%;background:white;border-right:1px solid #eee" id="leftList">
      ${mainCats.map((c,i)=>`<button style="width:100%;padding:16px 8px;text-align:left;border-bottom:1px solid #f5f5f5;font-size:12px;font-weight:${i==0?'800':'600'};color:${i==0?'#f68b1e':'#333'};border-left:${i==0?'4px solid #f68b1e':'4px solid transparent'};background:${i==0?'#fff8f0':'white'}" data-cat="${c}">${c}</button>`).join('')}
    </div>
    <div style="width:65%;padding:8px;background:#f5f5f5;overflow-y:auto;max-height:75vh" id="rightList"></div>
  </div>`;
 function drawRight(cat){
  const sections=CATEGORY_DATA[cat];
  document.getElementById('rightList').innerHTML=Object.entries(sections).map(([t,its])=>`
   <div style="background:white;border-radius:8px;margin-bottom:10px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;padding:12px;font-weight:800;border-bottom:1px solid #f0f0f0;font-size:13px">${t} <span style="color:#f68b1e">See All</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px">
      ${its.map(it=>`<div style="text-align:center"><div style="width:100%;aspect-ratio:1;background:#f8f8f8;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px">📦</div><p style="font-size:10px;margin-top:4px;font-weight:600">${it}</p></div>`).join('')}
    </div>
   </div>`).join('');
 }
 drawRight(mainCats[0]);
 document.querySelectorAll('#leftList button').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('#leftList button').forEach(b=>{b.style.color='#333';b.style.fontWeight='600';b.style.background='white';b.style.borderLeft='4px solid transparent'});
  btn.style.color='#f68b1e';btn.style.fontWeight='800';btn.style.background='#fff8f0';btn.style.borderLeft='4px solid #f68b1e';
  drawRight(btn.dataset.cat);
 })});
}

function switchTab(tab){
 document.querySelectorAll('.bottom-nav .nav-item').forEach(n=>n.classList.remove('active'));
 const activeBtn=document.querySelector(`.bottom-nav .nav-item[data-tab="${tab}"]`);
 if(activeBtn) activeBtn.classList.add('active');
 if(tab==='home') renderHome();
 if(tab==='categories') showCategoriesView();
 if(tab==='cart'){catSection.style.display='none';bannerContainer.style.display='none';sectionTitle.textContent='Cart';productGrid.innerHTML='<div style="padding:40px;text-align:center;background:white;border-radius:12px;width:100%">🛒 Cart empty</div>'}
 if(tab==='wishlist'){catSection.style.display='none';bannerContainer.style.display='none';sectionTitle.textContent='Wishlist';productGrid.innerHTML='<div style="padding:40px;text-align:center;background:white;border-radius:12px;width:100%">♡ Wishlist empty</div>'}
 if(tab==='account'){catSection.style.display='none';bannerContainer.style.display='none';sectionTitle.textContent='Account';productGrid.innerHTML='<div style="padding:20px;background:white;border-radius:12px;width:100%">My Account<br><br><a href="/login.html" style="background:#f68b1e;color:white;padding:10px 20px;border-radius:8px;display:inline-block">Login</a></div>'}
 window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.bottom-nav .nav-item').forEach(item=>{item.addEventListener('click',e=>{e.preventDefault();switchTab(item.dataset.tab)})});
renderHome();
</script>
</body>
</html>
