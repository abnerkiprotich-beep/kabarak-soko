<script>
let cart = JSON.parse(localStorage.getItem('kabarakSokoCart')||'[]');
const cartCountEl = document.getElementById('cartCount');

function updateCart(){ 
  if(cartCountEl) cartCountEl.textContent = cart.reduce((a,b)=>a+(b.qty||0),0);
  localStorage.setItem('kabarakSokoCart', JSON.stringify(cart));
}

function addToCart(name, price){
  let exist = cart.find(c => c.name === name);
  if(exist){ exist.qty++; } else { cart.push({name, price, qty:1}); }
  updateCart();
  alert(name + ' added to cart ✅');
}

// MAKE HEADER BUTTONS WORK TOO
document.querySelectorAll('[data-tab="cart"]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.preventDefault();
    window.location.href = '/cart.html';
  });
});
document.querySelectorAll('[data-tab="account"]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.preventDefault();
    const user = localStorage.getItem('kabarakSokoUser');
    window.location.href = user ? '/account.html' : '/login.html';
  });
});

// BOTTOM NAV - FIXED
document.querySelectorAll('.bottom-nav-item').forEach(item=>{
  item.addEventListener('click', (e)=>{
    e.preventDefault();
    const tab = item.dataset.tab;

    if(tab === 'home'){
      document.querySelectorAll('.bottom-nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
      // if you are on index.html, stay. If not, go home
      if(window.location.pathname !== '/' && window.location.pathname !== '/index.html'){
        window.location.href = '/';
      }
    }
    if(tab === 'categories'){
      document.querySelectorAll('.bottom-nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      document.getElementById('sectionTitle').scrollIntoView({behavior:'smooth'});
    }
    if(tab === 'cart'){
      window.location.href = '/cart.html'; // REAL PAGE - NOT CLOSE
    }
    if(tab === 'wishlist'){
      window.location.href = '/cart.html'; // you don't have wishlist.html, so goes to cart for now. Create wishlist.html later
    }
    if(tab === 'account'){
      const user = localStorage.getItem('kabarakSokoUser');
      window.location.href = user ? '/account.html' : '/login.html';
    }
  });
});

// ADD TO CART BUTTONS WORK NOW
document.addEventListener('click', (e)=>{
  if(e.target.classList.contains('add-cart-button')){
    const card = e.target.closest('.product-card');
    const name = card.querySelector('.product-name').innerText;
    const price = card.querySelector('.product-price').innerText;
    addToCart(name, price);
  }
});

updateCart();
</script>
