<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kabarak Soko</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;min-height:100%}
        body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f5;color:#111827}
        .top-bar{width:100%;background:#15803d;min-height:114px;display:flex;align-items:center;padding:0 42px;box-shadow:0 2px 5px rgba(0,0,0,0.08)}
        .brand{color:#ffffff;font-size:44px;font-weight:800;letter-spacing:-1px}
        .page-container{width:100%;min-height:calc(100vh - 114px);display:flex;justify-content:center;align-items:flex-start;padding:90px 28px 60px}
        .login-card{width:100%;max-width:635px;background:#ffffff;border-radius:10px;padding:58px 53px 54px;box-shadow:0 5px 20px rgba(0,0,0,0.10)}
        .login-title{text-align:center;font-size:55px;line-height:1.1;font-weight:800;color:#050505;margin-bottom:18px}
        .login-subtitle{text-align:center;color:#737373;font-size:29px;line-height:1.3;margin-bottom:45px}
        .message{width:100%;border-radius:8px;padding:21px 21px;font-size:23px;line-height:1.3;margin-bottom:35px;display:none}
        .message.success{display:block;background:#e8f7ec;color:#24743d;border:1px solid #d3eedb}
        .message.error{display:block;background:#fdecec;color:#b42318;border:1px solid #f5caca}
        .message.info{display:block;background:#edf8f1;color:#166534;border:1px solid #d5eddd}
        .form-group{margin-bottom:30px}
        .form-label{display:block;font-size:27px;font-weight:700;color:#111111;margin-bottom:13px}
        .form-input{width:100%;height:81px;padding:0 23px;border:1px solid #c9c9c9;border-radius:7px;background:#eef4ff;color:#111111;font-size:25px;outline:none;transition:border-color 0.2s ease,box-shadow 0.2s ease,background 0.2s ease}
        .form-input::placeholder{color:#888888}
        .form-input:focus{background:#ffffff;border-color:#22a447;box-shadow:0 0 0 3px rgba(34,164,71,0.14)}
        .password-wrapper{position:relative;width:100%}
        .password-wrapper .form-input{padding-right:75px}
        .toggle-password{position:absolute;right:20px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:#4b5563;font-size:19px;cursor:pointer;padding:8px}
        .login-button{width:100%;height:84px;margin-top:1px;border:none;border-radius:7px;background:#16a34a;color:#ffffff;font-size:27px;font-weight:700;cursor:pointer;transition:background 0.2s ease,transform 0.1s ease,box-shadow 0.2s ease;box-shadow:0 3px 7px rgba(22,163,74,0.20)}
        .login-button:hover{background:#15803d}
        .login-button:disabled{background:#86c99d;cursor:not-allowed;box-shadow:none}
        .account-text{text-align:center;margin-top:40px;font-size:27px;color:#111111;line-height:1.5}
        .account-text a{color:#16a34a;font-weight:700;text-decoration:none}
        .back-link{display:block;text-align:center;margin-top:31px;font-size:27px;color:#5b5b5b;text-decoration:none}
        .button-content{display:inline-flex;align-items:center;justify-content:center;gap:12px}
        .spinner{width:23px;height:23px;border:3px solid rgba(255,255,255,0.45);border-top-color:#ffffff;border-radius:50%;animation:spin 0.75s linear infinite;display:none}
        .loading .spinner{display:inline-block}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @media (max-width:700px){.top-bar{min-height:112px;padding:0 40px}.brand{font-size:40px}.page-container{padding:88px 28px 50px}.login-card{padding:55px 53px 50px}.login-title{font-size:52px}.login-subtitle{font-size:28px}.form-label{font-size:26px}.form-input{font-size:24px}.account-text,.back-link{font-size:26px}}
        @media (max-width:520px){.top-bar{min-height:105px;padding:0 30px}.brand{font-size:35px}.page-container{padding:55px 20px 40px}.login-card{padding:40px 25px 42px;border-radius:9px}.login-title{font-size:39px}.login-subtitle{font-size:22px;margin-bottom:35px}.message{font-size:18px;padding:17px}.form-label{font-size:22px}.form-input{height:67px;font-size:20px;padding:0 18px}.login-button{height:70px;font-size:23px}.account-text,.back-link{font-size:21px}}
    </style>
</head>
<body>
    <header class="top-bar"><div class="brand">KABARAK SOKO</div></header>
    <main class="page-container">
        <section class="login-card">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Login to your Kabarak Soko account</p>
            <div id="message" class="message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword">Show</button>
                    </div>
                </div>
                <button type="submit" class="login-button" id="loginButton"><span class="button-content"><span class="spinner" id="spinner"></span><span id="buttonText">Login</span></span></button>
            </form>
            <p class="account-text">Don't have an account? <a href="register.html">Create Account</a></p>
            <a href="index.html" class="back-link">← Back to Kabarak Soko</a>
        </section>
    </main>
<script>
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const buttonText = document.getElementById("buttonText");
const messageBox = document.getElementById("message");
const togglePassword = document.getElementById("togglePassword");

function showMessage(message, type){ messageBox.textContent = message; messageBox.className = "message " + type; }
function clearMessage(){ messageBox.textContent = ""; messageBox.className = "message"; }

togglePassword.addEventListener("click", function(){
    if(passwordInput.type === "password"){ passwordInput.type="text"; togglePassword.textContent="Hide"; }
    else{ passwordInput.type="password"; togglePassword.textContent="Show"; }
});

loginForm.addEventListener("submit", async function(event){
    event.preventDefault();
    clearMessage();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if(!email){ showMessage("Please enter your email.","error"); emailInput.focus(); return; }
    if(!password){ showMessage("Please enter your password.","error"); passwordInput.focus(); return; }

    loginButton.disabled = true;
    loginButton.classList.add("loading");
    buttonText.textContent = "Logging in...";

    try{
        const response = await fetch("/api/auth/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({email:email,password:password})
        });
        let data = {};
        try{ data = await response.json(); }catch(e){ data = {}; }

        if(!response.ok){
            const errorMessage = data.message || data.error || "Invalid email or password.";
            showMessage(errorMessage,"error");
            loginButton.disabled = false;
            loginButton.classList.remove("loading");
            buttonText.textContent = "Login";
            return;
        }

        // SUCCESS - FIXED PART
        showMessage("Login successful! Redirecting...","success");
        if(data.token) localStorage.setItem('kabarakToken', data.token);
        if(data.user) localStorage.setItem('kabarakUser', JSON.stringify(data.user));
        if(data.user && data.user.email) localStorage.setItem('kabarakEmail', data.user.email);
        localStorage.setItem('isLoggedIn','true');

        setTimeout(()=>{ window.location.href = "index.html"; }, 1000);

    }catch(error){
        console.error(error);
        showMessage("Cannot connect to server. Make sure backend is running on port 5000.","error");
        loginButton.disabled = false;
        loginButton.classList.remove("loading");
        buttonText.textContent = "Login";
    }
});
</script>
</body>
</html>
