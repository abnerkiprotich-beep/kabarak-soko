<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kabarak Soko</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;min-height:100%}
        body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f5;color:#111827}
        .top-bar{width:100%;background:#15803d;min-height:62px;display:flex;align-items:center;padding:0 20px;box-shadow:0 2px 5px rgba(0,0,0,0.08)}
        .brand{color:#ffffff;font-size:22px;font-weight:800;letter-spacing:-0.5px}
        .page-container{width:100%;min-height:calc(100vh - 62px);display:flex;justify-content:center;align-items:center;padding:24px 16px}
        .login-card{width:100%;max-width:400px;background:#ffffff;border-radius:12px;padding:28px 22px;box-shadow:0 4px 18px rgba(0,0,0,0.08)}
        .login-title{text-align:center;font-size:26px;line-height:1.2;font-weight:800;color:#050505;margin-bottom:6px}
        .login-subtitle{text-align:center;color:#6b7280;font-size:14px;line-height:1.4;margin-bottom:22px}
        .message{width:100%;border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.4;margin-bottom:18px;display:none}
        .message.success{display:block;background:#e8f7ec;color:#24743d;border:1px solid #d3eedb}
        .message.error{display:block;background:#fdecec;color:#b42318;border:1px solid #f5caca}
        .message.info{display:block;background:#edf8f1;color:#166534;border:1px solid #d5eddd}
        .form-group{margin-bottom:16px}
        .form-label{display:block;font-size:13px;font-weight:700;color:#111111;margin-bottom:6px}
        .form-input{width:100%;height:46px;padding:0 14px;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb;color:#111111;font-size:14px;outline:none;transition:border-color 0.2s ease,box-shadow 0.2s ease,background 0.2s ease}
        .form-input::placeholder{color:#9ca3af}
        .form-input:focus{background:#ffffff;border-color:#22a447;box-shadow:0 0 0 3px rgba(34,164,71,0.14)}
        .password-wrapper{position:relative;width:100%}
        .password-wrapper .form-input{padding-right:60px}
        .toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:#4b5563;font-size:12px;font-weight:700;cursor:pointer;padding:6px}
        .toggle-password:hover{color:#15803d}
        .login-button{width:100%;height:46px;margin-top:4px;border:none;border-radius:8px;background:#16a34a;color:#ffffff;font-size:15px;font-weight:700;cursor:pointer;transition:background 0.2s ease,transform 0.1s ease,box-shadow 0.2s ease;box-shadow:0 2px 6px rgba(22,163,74,0.20)}
        .login-button:hover{background:#15803d}
        .login-button:active{transform:translateY(1px)}
        .login-button:disabled{background:#86c99d;cursor:not-allowed;box-shadow:none}
        .account-text{text-align:center;margin-top:20px;font-size:13px;color:#111111;line-height:1.5}
        .account-text a{color:#16a34a;font-weight:700;text-decoration:none}
        .account-text a:hover{color:#15803d;text-decoration:underline}
        .back-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:#6b7280;text-decoration:none}
        .back-link:hover{color:#15803d}
        .button-content{display:inline-flex;align-items:center;justify-content:center;gap:8px}
        .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.45);border-top-color:#ffffff;border-radius:50%;animation:spin 0.75s linear infinite;display:none}
        .loading .spinner{display:inline-block}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @media (max-width:700px){
            .top-bar{min-height:60px;padding:0 16px}
            .brand{font-size:20px}
            .page-container{padding:20px 14px;align-items:flex-start;padding-top:30px}
            .login-card{padding:26px 20px}
        }
    </style>
</head>
<body>
    <header class="top-bar"><div class="brand">KABARAK SOKO</div></header>
    <main class="page-container">
        <section class="login-card">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Login to your Kabarak Soko account</p>
            <div id="message" class="message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">Show</button>
                    </div>
                </div>
                <a href="/forgot-password.html" style="display:block;text-align:right;font-size:13px;color:#16834b;margin-top:10px;">Forgot Password?</a>
                <button type="submit" class="login-button" id="loginButton"><span class="button-content"><span class="spinner" id="spinner"></span><span id="buttonText">Login</span></span></button>
            </form>
            <p class="account-text">Don't have an account? <a href="register.html">Create Account</a></p>
            <a href="index.html" class="back-link">← Back to Kabarak Soko</a>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const buttonText = document.getElementById("buttonText");
        const messageBox = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = "message " + type;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        togglePassword.addEventListener("click", function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
                togglePassword.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
                togglePassword.setAttribute("aria-label", "Show password");
            }
        });

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            clearMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email) {
                showMessage("Please enter your email.", "error");
                emailInput.focus();
                return;
            }
            if (!password) {
                showMessage("Please enter your password.", "error");
                passwordInput.focus();
                return;
            }

            loginButton.disabled = true;
            loginButton.classList.add("loading");
            buttonText.textContent = "Logging in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    const errorMessage = data.message || data.error || "Invalid email or password.";
                    showMessage(errorMessage, "error");
                    loginButton.disabled = false;
                    loginButton.classList.remove("loading");
                    buttonText.textContent = "Login";
                    return;
                }

                // Save token and user info
                if (data.token) {
                    localStorage.setItem('kabarakSokoToken', data.token);
                }
                if (data.user) {
                    localStorage.setItem('kabarakSokoUser', JSON.stringify(data.user));
                }
                localStorage.setItem('isLoggedIn', 'true');

                showMessage("Login successful! Redirecting...", "success");

                // Determine redirect based on admin status
                setTimeout(() => {
                    if (data.user && data.user.isAdmin === true) {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 800);

            } catch (error) {
                console.error(error);
                showMessage("Cannot connect to server. Check backend is running.", "error");
                loginButton.disabled = false;
                loginButton.classList.remove("loading");
                buttonText.textContent = "Login";
            }
        });
    </script>
</body>
</html>
