<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Kabarak Soko</title>
  <style>
    body{font-family:Arial, sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f5f5;margin:0}
    .page-container{width:100%;padding:20px;display:flex;justify-content:center}
    .login-card{background:white;padding:30px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
    h2{color:#16834b;text-align:center;margin-bottom:10px}
    p.subtitle{color:#666;text-align:center;font-size:14px;margin-bottom:20px}
    .form-group{margin-bottom:15px}
    .form-label{display:block;margin-bottom:5px;font-weight:600;font-size:14px}
    .form-input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:14px}
    .login-button{width:100%;padding:12px;background:#16834b;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
    .login-button:hover{background:#126a3c}
    .back-link{display:block;text-align:center;margin-top:20px;font-size:14px;color:#16834b;text-decoration:none}
    #message{margin-top:15px;padding:10px;border-radius:6px;text-align:center;font-size:14px;display:none}
    .success{background:#e8f5e9;color:#2e7d32;display:block !important}
    .error{background:#ffebee;color:#c62828;display:block !important}
  </style>
</head>
<body>
  <main class="page-container">
    <section class="login-card">
      <h2>Forgot Password?</h2>
      <p class="subtitle">Enter your email and we will send you a reset link</p>
      
      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
        </div>
        
        <button type="submit" class="login-button" id="submitBtn">Send Reset Link</button>
      </form>
      
      <div id="message"></div>
      
      <a href="/login.html" class="back-link">← Back to Login</a>
    </section>
  </main>

<script>
const forgotForm = document.getElementById('forgotForm');
const emailInput = document.getElementById('email');
const messageBox = document.getElementById('message');
const submitBtn = document.getElementById('submitBtn');

function showMessage(msg, type){
  messageBox.textContent = msg;
  messageBox.className = type;
  messageBox.style.display = 'block';
}

forgotForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  
  submitBtn.textContent = 'Sending...';
  submitBtn.disabled = true;
  
  try{
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    
    if(res.ok){
      showMessage(data.message, 'success');
    } else {
      showMessage(data.message, 'error');
    }
  }catch(err){
    showMessage('Error: ' + err.message, 'error');
  } finally {
    submitBtn.textContent = 'Send Reset Link';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
